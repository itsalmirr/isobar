# isobar Phase 0 recorder config.
# Copy to config/config.yaml and edit. Env vars (ISOBAR_*) override these.

# Where journals are written. One subdir per source.
data_dir: ./data

# Per-source journal tuning. Trade durability vs throughput here.
journal:
  # Rotate to a new file when this size or age is hit (whichever first).
  max_file_bytes: 268435456     # 256 MiB
  max_file_age:   1h
  # Flush + fsync cadence. Smaller = less data loss on crash, more syscalls.
  flush_every:    250ms
  # Buffered channel between WS receiver and writer goroutine.
  # Sized for ~2s of bursty Kalshi orderbook traffic; if full, we drop and
  # log at warn (recorder, not trader — never block the producer).
  queue_size:     16384
  # If true, gzip the file when rotating. Saves 5-10x on disk.
  compress_on_rotate: true

# --- Sources ---------------------------------------------------------------

kalshi:
  enabled: true
  api_base: https://api.elections.kalshi.com/trade-api/v2
  ws_url:   wss://api.elections.kalshi.com/trade-api/ws/v2
  # Series prefixes. Highs use KXHIGH{CITY}; lows use KXLOWT{CITY} (note
  # the extra "T" and "NYC" on the low-NY ticker — Kalshi naming is asymmetric).
  series:
    - KXHIGHNY     # NYC daily high
    - KXHIGHMIA    # Miami daily high
    - KXHIGHLAX    # LA daily high
    - KXHIGHCHI    # Chicago daily high
    - KXLOWTNYC    # NYC daily low
    - KXLOWTMIA    # Miami daily low
    - KXLOWTLAX    # LA daily low
    - KXLOWTCHI    # Chicago daily low
  # Channels to subscribe to per market.
  channels:
    - orderbook_delta
    - trade
  # WS reconnect tuning.
  reconnect:
    initial_backoff: 500ms
    max_backoff:     30s
    max_attempts:    0           # 0 = retry forever
  # How often to re-run DiscoverOpenTickers and resubscribe. Without this,
  # the recorder stops getting frames after the initially-subscribed
  # brackets settle (typically end of local day) — see the Apr 29-30
  # production tape post-mortem. 4h is the default; 0 disables.
  rediscover_interval: 4h

openmeteo:
  enabled: true
  base_url: https://ensemble-api.open-meteo.com/v1/ensemble
  # Comma-separated list. "gfs_seamless,ecmwf_ifs025" gives a combined
  # 80-member ensemble (30 GFS + 50 ECMWF) — two independent forecast
  # sources reduce single-model bias risk. The parser in
  # internal/edge/openmeteo.go discovers per-model member columns via
  # the *_<model> suffix Open-Meteo emits in multi-model responses.
  model: gfs_seamless,ecmwf_ifs025
  # Poll cadence. GFS publishes new runs every 6h, but member fields update
  # within the run; 30m polling is enough to catch refreshes without abuse.
  poll_interval: 30m
  # Locations correspond 1:1 with Kalshi weather series above.
  locations:
    - { name: NY,  lat: 40.7794, lon: -73.9692 }   # Central Park
    - { name: MIA, lat: 25.7617, lon: -80.1918 }   # Miami Intl
    - { name: LAX, lat: 33.9416, lon: -118.4085 }  # LAX
    - { name: CHI, lat: 41.7842, lon: -87.7553 }   # KMDW (Chicago Midway — Kalshi resolves KXHIGHCHI/KXLOWTCHI here, NWS-canonical per audit/chi-blast-radius.md)
  variables:
    - temperature_2m
    - temperature_2m_max
    - temperature_2m_min
    - precipitation
  forecast_days: 3
