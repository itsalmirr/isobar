name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no gitignored-but-tracked files
        run: |
          set -euo pipefail
          # Find any tracked file that matches a .gitignore pattern.
          # `git ls-files -i -c --exclude-standard` lists tracked files that
          # would be ignored by gitignore rules — a strict mode is to fail if
          # this returns any path.
          VIOLATIONS=$(git ls-files -i -c --exclude-standard || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: the following files are tracked but match .gitignore rules:" >&2
            echo "$VIOLATIONS" >&2
            echo "Fix by: git rm --cached -r <file> and committing." >&2
            exit 1
          fi
          echo "No gitignored-but-tracked files. OK."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build all binaries
        run: make build-all

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1
